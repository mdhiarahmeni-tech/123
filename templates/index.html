<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader - Download Any Video</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/>
                </svg>
                <span>VideoDlr</span>
            </div>
            <p class="tagline">Download any video from anywhere</p>
        </header>

        <main>
            <div class="download-card">
                <div class="input-section">
                    <div class="input-wrapper">
                        <input type="text" id="urlInput" placeholder="Paste video URL here..." autocomplete="off">
                        <button id="fetchBtn" class="btn-fetch">
                            <span class="btn-text">Fetch Info</span>
                            <span class="loading-spinner"></span>
                        </button>
                    </div>
                    <div class="format-section" id="formatSection" style="display: none;">
                        <div class="video-info" id="videoInfo"></div>
                        <div class="format-options">
                            <label>Download Format:</label>
                            <div class="format-buttons">
                                <button class="format-btn active" data-format="best">Best Quality</button>
                                <button class="format-btn" data-format="1080p">1080p HD</button>
                                <button class="format-btn" data-format="720p">720p</button>
                                <button class="format-btn" data-format="480p">480p</button>
                                <button class="format-btn" data-format="audio">Audio Only (MP3)</button>
                            </div>
                        </div>
                        <button id="downloadBtn" class="btn-download">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 16L16 11H13V4H11V11H8L12 16Z"/>
                                <path d="M20 18H4C3.45 18 3 17.55 3 17C3 16.45 3.45 16 4 16H20C20.55 16 21 16.45 21 17C21 17.55 20.55 18 20 18Z"/>
                            </svg>
                            Download Video
                        </button>
                    </div>
                </div>
                
                <div class="progress-section" id="progressSection" style;">
                    <div class="progress-header">
                        <span="display: none class="progress-status" id="progressStatus">Preparing download...</span>
                        <span class="progress-percent" id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <div class="supported-sites">
                    <h3>Supported Platforms</h3>
                    <div class="sites-grid">
                        <span class="site-badge">YouTube</span>
                        <span class="site-badge">Vimeo</span>
                        <span class="site-badge">Twitter</span>
                        <span class="site-badge">Instagram</span>
                        <span class="site-badge">Facebook</span>
                        <span class="site-badge">TikTok</span>
                        <span class="site-badge">Dailymotion</span>
                        <span class="site-badge">Reddit</span>
                        <span class="site-badge">Twitch</span>
                        <span class="site-badge">And 1000+ more!</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>For personal use only. Respect content creators' rights.</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
