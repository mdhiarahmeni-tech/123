<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .instructions {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: opacity 0.3s ease;
            user-select: none;
        }

        .instructions:hover {
            opacity: 1;
        }

        .instructions h2 {
            margin-bottom: 10px;
            font-size: 16px;
            color: #fff;
        }

        .instructions p {
            margin: 5px 0;
            line-height: 1.5;
        }

        .instructions .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
        }

        .instructions.hidden {
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="instructions" id="instructions">
        <h2>✨ Cosmic Playground</h2>
        <p><span class="key">Move</span> Create particle trails</p>
        <p><span class="key">Click</span> Explosive burst</p>
        <p><span class="key">1</span> Rainbow mode</p>
        <p><span class="key">2</span> Fire particles</p>
        <p><span class="key">3</span> Ice particles</p>
        <p><span class="key">4</span> Galaxy mode</p>
        <p><span class="key">Space</span> Black hole</p>
        <p><span class="key">H</span> Hide/show help</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // State
        let particles = [];
        let stars = [];
        let blackHole = null;
        let mouseX = width / 2;
        let mouseY = height / 2;
        let hue = 0;
        let mode = 'rainbow';
        let time = 0;

        // Create background stars
        function createStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 2,
                    twinkle: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 0.5
                });
            }
        }

        // Particle class
        class Particle {
            constructor(x, y, type = 'normal') {
                this.x = x;
                this.y = y;
                this.type = type;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = type === 'explosion' ? 3 + Math.random() * 5 : 
                              type === 'blackhole' ? 8 + Math.random() * 4 :
                              type === 'galaxy' ? 2 + Math.random() * 3 :
                              1 + Math.random() * 2;
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.life = 1;
                this.decay = type === 'explosion' ? 0.015 + Math.random() * 0.01 :
                            type === 'blackhole' ? 0.03 :
                            0.008 + Math.random() * 0.005;
                
                this.size = type === 'explosion' ? 3 + Math.random() * 4 :
                           type === 'blackhole' ? 4 + Math.random() * 3 :
                           2 + Math.random() * 3;
                
                if (mode === 'fire') {
                    this.hue = 10 + Math.random() * 40;
                } else if (mode === 'ice') {
                    this.hue = 180 + Math.random() * 40;
                } else if (mode === 'galaxy') {
                    this.hue = hue + Math.random() * 60;
                } else {
                    this.hue = hue + Math.random() * 40;
                }
                
                this.glow = Math.random() * 20;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                
                // Black hole attraction
                if (blackHole) {
                    const dx = blackHole.x - this.x;
                    const dy = blackHole.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist > 50 && dist < 400) {
                        const force = blackHole.strength / dist;
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                    }
                    
                    if (dist < 30) {
                        this.life = 0;
                    }
                }

                // Galaxy spiral
                if (this.type === 'galaxy' && blackHole) {
                    const dx = blackHole.x - this.x;
                    const dy = blackHole.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist > 30 && dist < 300) {
                        const angle = Math.atan2(dy, dx);
                        const spiralAngle = angle + 0.05;
                        this.vx += Math.cos(spiralAngle) * 0.3;
                        this.vy += Math.sin(spiralAngle) * 0.3;
                    }
                }

                // Friction
                this.vx *= 0.99;
                this.vy *= 0.99;

                // Shrink
                this.size *= 0.995;
            }

            draw() {
                const alpha = this.life;
                const glowSize = this.size + this.glow * this.life;
                
                // Glow effect
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, glowSize
                );
                
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, ${alpha})`);
                gradient.addColorStop(0.3, `hsla(${this.hue}, 100%, 50%, ${alpha * 0.6})`);
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, ${alpha})`;
                ctx.fill();
            }
        }

        // Create explosion
        function createExplosion(x, y, count = 50) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, 'explosion'));
            }
        }

        // Create black hole
        function createBlackHole(x, y) {
            blackHole = {
                x: x,
                y: y,
                strength: 15,
                life: 300
            };
            
            // Particle swirl effect
            for (let i = 0; i < 100; i++) {
                const angle = (i / 100) * Math.PI * 2;
                const dist = 100 + Math.random() * 100;
                particles.push(new Particle(
                    x + Math.cos(angle) * dist,
                    y + Math.sin(angle) * dist,
                    'blackhole'
                ));
            }
        }

        // Draw background stars
        function drawStars() {
            stars.forEach(star => {
                const twinkle = Math.sin(time * star.speed + star.twinkle) * 0.5 + 0.5;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size * twinkle, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + twinkle * 0.7})`;
                ctx.fill();
            });
        }

        // Draw black hole
        function drawBlackHole() {
            if (!blackHole) return;
            
            blackHole.life--;
            
            if (blackHole.life <= 0) {
                blackHole = null;
                return;
            }

            const pulse = Math.sin(time * 0.1) * 5;
            const gradient = ctx.createRadialGradient(
                blackHole.x, blackHole.y, 0,
                blackHole.x, blackHole.y, 80 + pulse
            );
            
            gradient.addColorStop(0, 'rgba(0, 0, 0, 1)');
            gradient.addColorStop(0.3, 'rgba(20, 0, 40, 0.8)');
            gradient.addColorStop(0.6, 'rgba(60, 0, 100, 0.4)');
            gradient.addColorStop(1, 'rgba(60, 0, 100, 0)');

            ctx.beginPath();
            ctx.arc(blackHole.x, blackHole.y, 80 + pulse, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Accretion disk
            ctx.save();
            ctx.translate(blackHole.x, blackHole.y);
            ctx.rotate(time * 0.02);
            
            for (let i = 0; i < 3; i++) {
                const offset = (i / 3) * Math.PI * 2;
                ctx.beginPath();
                ctx.ellipse(0, 0, 60 + i * 10, 20 + i * 5, offset, 0, Math.PI * 2);
                ctx.strokeStyle = `hsla(${280 + i * 20}, 100%, 60%, ${0.3 - i * 0.1})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            
            ctx.restore();
        }

        // Main animation loop
        function animate() {
            // Fade effect for trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            drawStars();
            drawBlackHole();

            // Update and draw particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // Spawn particles on mouse move
            if (time % 2 === 0) {
                const particleType = mode === 'galaxy' ? 'galaxy' : 'normal';
                for (let i = 0; i < 3; i++) {
                    const offsetX = (Math.random() - 0.5) * 20;
                    const offsetY = (Math.random() - 0.5) * 20;
                    particles.push(new Particle(mouseX + offsetX, mouseY + offsetY, particleType));
                }
            }

            // Update hue
            hue = (hue + 0.5) % 360;
            time++;

            requestAnimationFrame(animate);
        }

        // Event listeners
        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('click', (e) => {
            createExplosion(e.clientX, e.clientY, 80);
            
            if (mode === 'galaxy') {
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createExplosion(
                            e.clientX + (Math.random() - 0.5) * 100,
                            e.clientY + (Math.random() - 0.5) * 100,
                            20
                        );
                    }, i * 100);
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case '1':
                    mode = 'rainbow';
                    break;
                case '2':
                    mode = 'fire';
                    break;
                case '3':
                    mode = 'ice';
                    break;
                case '4':
                    mode = 'galaxy';
                    break;
                case ' ':
                    e.preventDefault();
                    createBlackHole(width / 2, height / 2);
                    break;
                case 'h':
                case 'H':
                    const instructions = document.getElementById('instructions');
                    instructions.classList.toggle('hidden');
                    break;
            }
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createStars();
        });

        // Touch support
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            createExplosion(touch.clientX, touch.clientY, 80);
        });

        // Initial burst for wow effect
        function initialBurst() {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createExplosion(
                        width / 2 + (Math.random() - 0.5) * 400,
                        height / 2 + (Math.random() - 0.5) * 300,
                        30
                    );
                }, i * 200);
            }
        }

        // Initialize
        createStars();
        initialBurst();
        animate();
    </script>
</body>
</html>
