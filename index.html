<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Particle Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            color: white;
            z-index: 100;
            min-width: 220px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .control-group {
            margin-bottom: 12px;
        }

        .control-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #aaa;
        }

        .mode-indicator {
            display: inline-block;
            padding: 5px 12px;
            background: #e94560;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .instructions {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 11px;
            line-height: 1.6;
            color: #888;
        }

        .instructions span {
            color: #e94560;
            font-weight: bold;
        }

        .stats {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            font-size: 12px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stats span {
            color: #e94560;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <h2>Particle Studio</h2>
        <div class="control-group">
            <label>Current Mode</label>
            <span class="mode-indicator" id="modeDisplay">Follow</span>
        </div>
        <div class="instructions">
            <p><span>MOUSE MOVE</span> &mdash; Guide particles</p>
            <p><span>CLICK</span> &mdash; Create explosion</p>
            <p><span>SPACE</span> &mdash; Toggle mode</p>
            <p><span>C</span> &mdash; Clear canvas</p>
        </div>
    </div>

    <div class="stats">
        Particles: <span id="particleCount">0</span> | 
        FPS: <span id="fps">0</span>
    </div>

    <script>
        /**
         * Interactive Particle Animation
         * Features:
         * - Mouse-following particles with physics
         * - Click-to-create explosion effects
         * - Multiple interaction modes
         * - Smooth 60fps animations using requestAnimationFrame
         */

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // UI elements
        const modeDisplay = document.getElementById('modeDisplay');
        const particleCountDisplay = document.getElementById('particleCount');
        const fpsDisplay = document.getElementById('fps');

        // Resize canvas to fill window
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Animation modes
        const MODES = {
            FOLLOW: 'follow',
            REPEL: 'repel',
            ORBIT: 'orbit'
        };

        // Application state
        const state = {
            mode: MODES.FOLLOW,
            mouse: { x: canvas.width / 2, y: canvas.height / 2 },
            isMouseDown: false,
            particles: [],
            shockwaves: [],
            stars: [],
            lastTime: 0,
            frameCount: 0,
            fps: 0
        };

        /**
         * Utility functions
         */
        const utils = {
            // Generate random number between min and max
            random: (min, max) => Math.random() * (max - min) + min,
            
            // Calculate distance between two points
            distance: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
            
            // Create a color with varying hue
            randomColor: () => {
                const hue = utils.random(0, 360);
                return `hsl(${hue}, 70%, 60%)`;
            },
            
            // Linear interpolation
            lerp: (start, end, factor) => start + (end - start) * factor
        };

        /**
         * Background Star class for depth effect
         */
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = utils.random(0, canvas.width);
                this.y = utils.random(0, canvas.height);
                this.size = utils.random(0.5, 2);
                this.speed = utils.random(0.1, 0.5);
                this.opacity = utils.random(0.3, 0.8);
                this.twinkleSpeed = utils.random(0.02, 0.05);
                this.twinkle = 0;
            }

            update() {
                // Subtle parallax movement based on mouse
                const dx = (state.mouse.x - canvas.width / 2) * 0.01 * this.speed;
                const dy = (state.mouse.y - canvas.height / 2) * 0.01 * this.speed;
                
                this.x -= dx;
                this.y -= dy;

                // Wrap around screen
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                // Twinkle effect
                this.twinkle += this.twinkleSpeed;
                this.currentOpacity = this.opacity + Math.sin(this.twinkle) * 0.2;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, this.currentOpacity)})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        /**
         * Shockwave effect for click interactions
         */
        class Shockwave {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 150;
                this.speed = 8;
                this.opacity = 1;
                this.lineWidth = 3;
                this.hue = utils.random(0, 360);
            }

            update() {
                this.radius += this.speed;
                this.opacity -= 0.02;
                this.lineWidth -= 0.03;
                
                return this.opacity > 0 && this.lineWidth > 0;
            }

            draw() {
                ctx.save();
                ctx.strokeStyle = `hsla(${this.hue}, 70%, 60%, ${this.opacity})`;
                ctx.lineWidth = Math.max(0.1, this.lineWidth);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        /**
         * Main Particle class
         */
        class Particle {
            constructor(x, y, isExplosion = false) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.baseSize = utils.random(2, 5);
                this.size = this.baseSize;
                this.hue = utils.random(0, 360);
                this.color = `hsl(${this.hue}, 70%, 60%)`;
                this.life = 1;
                this.decay = isExplosion ? utils.random(0.005, 0.015) : 0;
                
                if (isExplosion) {
                    // Explosive velocity
                    const angle = utils.random(0, Math.PI * 2);
                    const speed = utils.random(2, 8);
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                }
            }

            update() {
                // Handle different movement modes
                switch (state.mode) {
                    case MODES.FOLLOW:
                        this.updateFollow();
                        break;
                    case MODES.REPEL:
                        this.updateRepel();
                        break;
                    case MODES.ORBIT:
                        this.updateOrbit();
                        break;
                }

                // Apply velocity
                this.x += this.vx;
                this.y += this.vy;

                // Apply friction
                this.vx *= 0.95;
                this.vy *= 0.95;

                // Decay life for explosion particles
                this.life -= this.decay;

                // Pulse effect based on velocity
                const speed = Math.hypot(this.vx, this.vy);
                this.size = this.baseSize + speed * 0.3;

                // Keep within bounds (bounce)
                if (this.x < 0 || this.x > canvas.width) {
                    this.vx *= -0.8;
                    this.x = Math.max(0, Math.min(canvas.width, this.x));
                }
                if (this.y < 0 || this.y > canvas.height) {
                    this.vy *= -0.8;
                    this.y = Math.max(0, Math.min(canvas.height, this.y));
                }

                return this.life > 0;
            }

            updateFollow() {
                // Smoothly follow mouse with easing
                const dx = state.mouse.x - this.x;
                const dy = state.mouse.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 5) {
                    const force = Math.min(dist * 0.001, 0.5);
                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                }

                // Add slight random movement
                this.vx += utils.random(-0.1, 0.1);
                this.vy += utils.random(-0.1, 0.1);
            }

            updateRepel() {
                // Move away from mouse
                const dx = this.x - state.mouse.x;
                const dy = this.y - state.mouse.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 200 && dist > 0) {
                    const force = (200 - dist) * 0.002;
                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                }

                // Return to center when far from mouse
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const toCenterX = centerX - this.x;
                const toCenterY = centerY - this.y;
                this.vx += toCenterX * 0.0005;
                this.vy += toCenterY * 0.0005;
            }

            updateOrbit() {
                // Orbit around mouse
                const dx = this.x - state.mouse.x;
                const dy = this.y - state.mouse.y;
                const dist = Math.hypot(dx, dy);

                if (dist > 0) {
                    // Orbital velocity perpendicular to radius
                    const orbitSpeed = 0.02 + (100 / (dist + 100)) * 0.02;
                    this.vx += -dy * orbitSpeed;
                    this.vy += dx * orbitSpeed;
                }

                // Maintain distance
                const targetDist = 100 + Math.sin(Date.now() * 0.001 + this.hue) * 50;
                if (dist > 0) {
                    const correction = (dist - targetDist) * 0.01;
                    this.vx -= (dx / dist) * correction;
                    this.vy -= (dy / dist) * correction;
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * Create explosion of particles at position
         */
        function createExplosion(x, y, count = 15) {
            for (let i = 0; i < count; i++) {
                state.particles.push(new Particle(x, y, true));
            }
            // Add shockwave
            state.shockwaves.push(new Shockwave(x, y));
        }

        /**
         * Initialize background stars
         */
        function initStars() {
            const starCount = Math.floor((canvas.width * canvas.height) / 4000);
            for (let i = 0; i < starCount; i++) {
                state.stars.push(new Star());
            }
        }

        /**
         * Initialize main particles
         */
        function initParticles() {
            const particleCount = 80;
            for (let i = 0; i < particleCount; i++) {
                state.particles.push(new Particle(
                    utils.random(0, canvas.width),
                    utils.random(0, canvas.height)
                ));
            }
        }

        /**
         * Draw connections between nearby particles
         */
        function drawConnections() {
            const maxDistance = 100;
            const maxConnections = 3;

            ctx.save();
            ctx.strokeStyle = 'rgba(233, 69, 96, 0.2)';
            ctx.lineWidth = 1;

            for (let i = 0; i < state.particles.length; i++) {
                let connections = 0;
                const p1 = state.particles[i];

                for (let j = i + 1; j < state.particles.length; j++) {
                    const p2 = state.particles[j];
                    const dist = utils.distance(p1.x, p1.y, p2.x, p2.y);

                    if (dist < maxDistance) {
                        const opacity = (1 - dist / maxDistance) * 0.3 * p1.life * p2.life;
                        ctx.strokeStyle = `rgba(233, 69, 96, ${opacity})`;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();

                        connections++;
                        if (connections >= maxConnections) break;
                    }
                }
            }
            ctx.restore();
        }

        /**
         * Main animation loop
         */
        function animate(currentTime) {
            // Calculate FPS
            state.frameCount++;
            if (currentTime - state.lastTime >= 1000) {
                state.fps = state.frameCount;
                state.frameCount = 0;
                state.lastTime = currentTime;
                fpsDisplay.textContent = state.fps;
            }

            // Clear canvas with fade effect
            ctx.fillStyle = 'rgba(26, 26, 46, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw stars
            state.stars.forEach(star => {
                star.update();
                star.draw();
            });

            // Update and draw shockwaves
            state.shockwaves = state.shockwaves.filter(wave => {
                const alive = wave.update();
                if (alive) wave.draw();
                return alive;
            });

            // Draw connections between particles
            drawConnections();

            // Update and draw particles
            state.particles = state.particles.filter(particle => {
                const alive = particle.update();
                if (alive) particle.draw();
                return alive;
            });

            // Replenish main particles if too few
            if (state.particles.length < 50) {
                state.particles.push(new Particle(
                    utils.random(0, canvas.width),
                    utils.random(0, canvas.height)
                ));
            }

            // Update particle count display
            particleCountDisplay.textContent = state.particles.length;

            requestAnimationFrame(animate);
        }

        /**
         * Event handlers
         */

        // Mouse movement
        canvas.addEventListener('mousemove', (e) => {
            state.mouse.x = e.clientX;
            state.mouse.y = e.clientY;
        });

        // Mouse click - create explosion
        canvas.addEventListener('mousedown', (e) => {
            state.isMouseDown = true;
            createExplosion(e.clientX, e.clientY, 20);
        });

        canvas.addEventListener('mouseup', () => {
            state.isMouseDown = false;
        });

        // Touch support for mobile
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            state.mouse.x = touch.clientX;
            state.mouse.y = touch.clientY;
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            state.mouse.x = touch.clientX;
            state.mouse.y = touch.clientY;
            createExplosion(touch.clientX, touch.clientY, 20);
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch (e.key.toLowerCase()) {
                case ' ':
                    // Toggle between modes
                    const modes = Object.values(MODES);
                    const currentIndex = modes.indexOf(state.mode);
                    state.mode = modes[(currentIndex + 1) % modes.length];
                    modeDisplay.textContent = state.mode;
                    break;
                
                case 'c':
                    // Clear explosion particles
                    state.particles = state.particles.filter(p => p.decay === 0);
                    state.shockwaves = [];
                    break;
            }
        });

        // Mode cycling via click on mode indicator
        modeDisplay.addEventListener('click', () => {
            const modes = Object.values(MODES);
            const currentIndex = modes.indexOf(state.mode);
            state.mode = modes[(currentIndex + 1) % modes.length];
            modeDisplay.textContent = state.mode;
        });

        /**
         * Initialize and start
         */
        initStars();
        initParticles();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
