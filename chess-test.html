<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chess Engine Test</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 16px; }
      input, button { font-size: 14px; padding: 6px 8px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
      pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow: auto; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </head>
  <body>
    <h1>Chess Engine Test</h1>

    <div class="row">
      <button id="resetBtn">Reset</button>
      <button id="legalBtn">Log legal moves (current turn)</button>
      <button id="undoBtn">Undo</button>
    </div>

    <div class="row">
      <label>
        From
        <input id="from" value="e2" size="4" />
      </label>
      <label>
        To
        <input id="to" value="e4" size="4" />
      </label>
      <label>
        Promotion
        <input id="promo" placeholder="queen/rook/bishop/knight" size="10" />
      </label>
      <button id="moveBtn">Make move</button>
    </div>

    <pre><code id="board"></code></pre>

    <p>
      Open DevTools console to see detailed output.
    </p>

    <script src="./chess-engine.js"></script>
    <script>
      const E = window.ChessEngine;
      let state = E.createInitialGameState();

      function render() {
        document.getElementById('board').textContent =
          E.printBoardAscii(state) +
          `\n\nTurn: ${state.turn}` +
          `\nCastling: W(K:${state.castlingRights.white.kingside ? 'Y' : 'N'} Q:${state.castlingRights.white.queenside ? 'Y' : 'N'})` +
          ` B(K:${state.castlingRights.black.kingside ? 'Y' : 'N'} Q:${state.castlingRights.black.queenside ? 'Y' : 'N'})` +
          `\nEn passant: ${state.enPassant ? E.squareToAlgebraic(state.enPassant) : '-'}` +
          `\nHalfmove: ${state.halfmoveClock}  Fullmove: ${state.fullmoveNumber}` +
          `\nResult (for side to move): ${E.getGameResult(state, state.turn)}`;
      }

      function logLegalMoves() {
        const moves = E.getLegalMoves(state, state.turn);
        console.log('Legal moves for', state.turn, moves.length);
        console.log(moves.map(m => {
          const u = E.squareToAlgebraic(m.from) + E.squareToAlgebraic(m.to);
          const promo = m.promotion ? `=${m.promotion}` : '';
          const flags = [m.isCastling ? `castle:${m.isCastling}` : null, m.isEnPassant ? 'ep' : null].filter(Boolean);
          return `${u}${promo}${flags.length ? ' [' + flags.join(',') + ']' : ''}`;
        }));
      }

      document.getElementById('resetBtn').addEventListener('click', () => {
        state = E.createInitialGameState();
        console.clear();
        console.log('Reset');
        render();
      });

      document.getElementById('legalBtn').addEventListener('click', () => {
        logLegalMoves();
      });

      document.getElementById('undoBtn').addEventListener('click', () => {
        const ok = E.undoLastMove(state);
        console.log(ok ? 'Undid last move' : 'Nothing to undo');
        render();
      });

      document.getElementById('moveBtn').addEventListener('click', () => {
        const from = document.getElementById('from').value.trim();
        const to = document.getElementById('to').value.trim();
        const promo = document.getElementById('promo').value.trim();
        try {
          E.makeMove(state, from, to, promo || undefined);
          console.log(`Move made: ${from} -> ${to}${promo ? '=' + promo : ''}`);
          console.log('Check?', E.isCheck(state, state.turn));
          console.log('Result:', E.getGameResult(state, state.turn));
          render();
        } catch (err) {
          console.error(err);
          render();
        }
      });

      console.log('Initial position');
      console.log(E.printBoardAscii(state));
      console.log('Legal moves at start (should be 20):', E.getLegalMoves(state, 'white').length);
      render();
    </script>
  </body>
</html>
